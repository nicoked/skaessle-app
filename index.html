<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!--
      Eine Inhalts-Sicherheitsrichtlinie als Meta-Tag, weil GitHub Pages keine
      eigenen HTTP-Header erlaubt. Sie beschränkt die Seite auf das, was sie
      tatsächlich braucht: eigene Bauteile plus Anfragen an api.github.com für
      den Abgleich – nichts sonst darf nachladen oder Daten irgendwohin
      schicken, selbst wenn sich einmal Schadcode einschmuggeln sollte.
    -->
    <!--
      Ohne "frame-ancestors": Die Regel wirkt nur über einen echten
      HTTP-Header, ein <meta>-Tag kann sie nicht durchsetzen – der Browser
      ignoriert sie dort ohnehin und würde nur eine Warnung in die Konsole
      schreiben.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="/skaessle-app/favicon.svg" />
    <!--
      Für „Zum Home-Bildschirm hinzufügen“ auf dem iPhone: Ohne Manifest und
      ohne eigenes Symbol nimmt iOS einen Bildschirmausschnitt der Seite als
      Icon und den Seitentitel als Namen – beides sieht aus wie ein Versehen.
    -->
    <link rel="manifest" href="/skaessle-app/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/skaessle-app/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="S'KÄSSLE" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f4fa" />
    <title>S'KÄSSLE</title>
    <script type="module" crossorigin src="/skaessle-app/assets/index-BRPe6ZrW.js"></script>
    <link rel="stylesheet" crossorigin href="/skaessle-app/assets/index-CNMdpml-.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
